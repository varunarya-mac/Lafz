<!doctype html>
<html lang="en">
<head>

<title>Lafz — Idioms & Shayari</title>
<meta name="description" content="Personal English idioms practice and shayari collection">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f6f8">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<body>
<div id="app">

  </div>

  <nav id="tabbar" class="tabbar" aria-label="Sections">

      <span>Practice</span>
    </button>

    </button>
  </nav>
</div>
<div id="overlay" class="overlay" hidden>
  <div class="backdrop"></div>
  <section class="sheet" role="dialog" aria-modal="true"></section>
</div>
<div id="toast" class="toast" hidden></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
